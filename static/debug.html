<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWA MTG Finder — Debug Panel</title>
<style>
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; }
  h1 { color: #7ec8e3; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 20px; font-size: 0.85em; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  input[type="text"] { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 8px 12px; font-family: monospace; font-size: 1em; border-radius: 4px; width: 240px; }
  button { background: #2a6496; color: #fff; border: none; padding: 8px 16px; font-family: monospace; font-size: 1em; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3a7ab6; }
  button:disabled { background: #444; cursor: not-allowed; }
  #copyBtn { background: #2a7a4a; }
  #copyBtn:hover { background: #3a9a5a; }
  #status { color: #aaa; font-size: 0.9em; margin-bottom: 16px; min-height: 1.4em; }
  .store-block { background: #222; border: 1px solid #333; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
  .store-name { font-weight: bold; font-size: 1em; margin-bottom: 6px; }
  .store-name .store-id { color: #888; font-weight: normal; font-size: 0.85em; margin-left: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-left: 8px; }
  .badge-ok { background: #1a4a2a; color: #5dba7c; }
  .badge-err { background: #4a1a1a; color: #e07070; }
  .badge-pending { background: #333; color: #888; }
  .result-count { color: #aaa; font-size: 0.85em; margin-bottom: 6px; }
  .error-msg { color: #e07070; font-size: 0.85em; margin-bottom: 6px; }
  pre { background: #2a2a2a; border: 1px solid #333; border-radius: 4px; padding: 10px; font-size: 0.78em; overflow-x: auto; margin: 0; white-space: pre-wrap; word-break: break-all; }
  .timing { color: #666; font-size: 0.78em; margin-top: 4px; }
  #results-area { display: none; }
</style>
</head>
<body>
<h1>NWA MTG Finder — Debug Panel</h1>
<p class="subtitle">Runs /health then queries each store sequentially via /api/search</p>

<div class="controls">
  <input type="text" id="cardInput" value="Lightning Bolt" placeholder="Card name" />
  <button id="runBtn" onclick="runDebug()">Run Debug</button>
  <button id="copyBtn" onclick="copyResults()" style="display:none">Copy Results</button>
</div>

<div id="status">Ready.</div>

<div id="results-area">
  <div id="store-blocks"></div>
</div>

<script>
const STORES = [
  { id: "chaos",    name: "Chaos Games" },
  { id: "xxplo",   name: "Games Explosion" },
  { id: "finalboss",name: "Final Boss Games" },
  { id: "gearbv",  name: "Gear Gaming — Bentonville" },
  { id: "gearfv",  name: "Gear Gaming — Fayetteville" },
];

let summaryLines = [];

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function initBlocks(card) {
  const container = document.getElementById("store-blocks");
  container.innerHTML = "";
  for (const s of STORES) {
    const div = document.createElement("div");
    div.className = "store-block";
    div.id = `block-${s.id}`;
    div.innerHTML = `
      <div class="store-name">${s.name}<span class="store-id">(${s.id})</span>
        <span class="badge badge-pending" id="badge-${s.id}">waiting</span>
      </div>
      <div id="body-${s.id}" style="color:#666;font-size:0.85em;">—</div>
    `;
    container.appendChild(div);
  }
}

function renderStoreResult(store, data, ms, err) {
  const badge = document.getElementById(`badge-${store.id}`);
  const body  = document.getElementById(`body-${store.id}`);

  if (err) {
    badge.className = "badge badge-err";
    badge.textContent = "fetch error";
    body.innerHTML = `<div class="error-msg">Network error: ${escHtml(String(err))}</div>`;
    summaryLines.push(`[${store.id}] FETCH ERROR: ${err}`);
    return;
  }

  const count   = Array.isArray(data.results) ? data.results.length : 0;
  const apiErr  = data.error || null;
  const first   = count > 0 ? data.results[0] : null;

  badge.className = apiErr ? "badge badge-err" : "badge badge-ok";
  badge.textContent = apiErr ? "error" : `${count} result${count !== 1 ? "s" : ""}`;

  let html = `<div class="result-count">${count} result(s) returned</div>`;
  if (apiErr) html += `<div class="error-msg">error: ${escHtml(apiErr)}</div>`;
  if (first)  html += `<pre>${escHtml(JSON.stringify(first, null, 2))}</pre>`;
  html += `<div class="timing">${ms}ms</div>`;
  body.innerHTML = html;

  summaryLines.push(`[${store.id}] ${store.name}: ${count} result(s)${apiErr ? " | error: " + apiErr : ""}${first ? " | first: " + JSON.stringify(first) : ""} (${ms}ms)`);
}

async function runDebug() {
  const card = document.getElementById("cardInput").value.trim();
  if (!card) { setStatus("Enter a card name first."); return; }

  document.getElementById("runBtn").disabled = true;
  document.getElementById("copyBtn").style.display = "none";
  document.getElementById("results-area").style.display = "block";
  summaryLines = [`Debug run: "${card}" at ${new Date().toISOString()}`];

  initBlocks(card);

  // 1. Health check
  setStatus("Checking /health …");
  try {
    const hr = await fetch("/health");
    const hj = await hr.json();
    summaryLines.push(`/health → ${JSON.stringify(hj)}`);
    setStatus(`/health OK (${hj.status}). Starting store queries …`);
  } catch (e) {
    setStatus(`/health failed: ${e}. Proceeding anyway …`);
    summaryLines.push(`/health FAILED: ${e}`);
  }

  // 2. Sequential per-store queries
  for (const store of STORES) {
    setStatus(`Querying ${store.name} (${store.id}) …`);
    const url = `/api/search?q=${encodeURIComponent(card)}&store=${store.id}`;
    const t0 = Date.now();
    let data = null, fetchErr = null;
    try {
      const resp = await fetch(url);
      data = await resp.json();
    } catch (e) {
      fetchErr = e;
    }
    const ms = Date.now() - t0;
    renderStoreResult(store, data, ms, fetchErr);
  }

  setStatus("Done.");
  summaryLines.push(`Completed at ${new Date().toISOString()}`);
  document.getElementById("runBtn").disabled = false;
  document.getElementById("copyBtn").style.display = "";
}

function copyResults() {
  const text = summaryLines.join("\n");
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    const orig = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
